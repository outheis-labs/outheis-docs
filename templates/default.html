<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- TITLE --></title>
  <link rel="icon" type="image/png" href="<!-- ROOT -->favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="<!-- ROOT -->favicon.svg">
  <link rel="shortcut icon" href="<!-- ROOT -->favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="<!-- ROOT -->apple-touch-icon.png">
  <link rel="manifest" href="<!-- ROOT -->site.webmanifest">
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('<!-- ROOT -->assets/fonts/InterVariable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'IBM Plex Sans';
      src: url('<!-- ROOT -->assets/fonts/IBMPlexSans-Variable.woff2') format('woff2-variations');
      font-weight: 100 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      src: url('<!-- ROOT -->assets/fonts/IBMPlexMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.65;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .greek {
      font-family: 'Inter', sans-serif;
    }

    /* Header with breadcrumb */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e0e0e0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 500;
    }

    .breadcrumb {
      font-size: 14px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .breadcrumb a {
      color: #666;
    }

    .breadcrumb a:hover {
      color: #1a1a1a;
    }

    .breadcrumb .separator {
      color: #ccc;
    }

    .breadcrumb .current {
      color: #1a1a1a;
    }

    header nav {
      font-size: 14px;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }

    header nav a {
      color: #888;
    }

    header nav a:hover {
      color: #1a1a1a;
    }

    .lang-switch {
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 14px;
      color: #888;
    }

    .lang-switch a {
      font-size: 14px;
      color: #888;
    }

    .lang-switch a:hover {
      color: #1a1a1a;
    }

    .lang-switch .lang-active {
      color: #1a1a1a;
      font-weight: 500;
    }

    /* Main */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    /* Page header */
    .page-header {
      margin-bottom: 3rem;
    }

    .page-header h1 {
      font-family: 'Inter', sans-serif;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .page-header .subtitle {
      font-size: 18px;
      font-style: italic;
      color: #555;
      margin-top: 0.75rem;
    }

    /* Content sections */
    .section {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      padding: 2.5rem 0;
      border-top: 1px solid #e0e0e0;
    }

    /* Mobile: hide label h2, show section-text h2 */
    .section > h2 {
      display: none;
    }

    .section-text h2 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .section-text > *:first-child {
      margin-top: 0;
    }

    /* Hidden h2 is first-child on desktop, so target the visible first element */
    .section-text > h2 + * {
      margin-top: 0;
    }

    .section-text > h2 + p {
      margin-top: 0;
    }

    .section-text p {
      font-size: 16px;
      line-height: 1.75;
      color: #333;
      margin-bottom: 1rem;
    }

    .section-text p:last-child {
      margin-bottom: 0;
    }

    .section-text h3 {
      font-size: 16px;
      font-weight: 450;
      color: #1a1a1a;
      line-height: 1.75;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .section-text h3:first-child,
    .section-text > h2 + h3 {
      margin-top: 0;
    }

    .section-text ul {
      list-style: none;
      margin-bottom: 1rem;
    }

    .section-text ul li {
      font-size: 16px;
      line-height: 1.65;
      color: #333;
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
    }

    .section-text ul li:last-child {
      border-bottom: none;
    }

    .section-text ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }

    .section-text ol li {
      font-size: 16px;
      line-height: 1.65;
      color: #333;
      margin-bottom: 0.5rem;
    }

    .section-text code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 14px;
      background: #f5f5f5;
      padding: 0.15em 0.4em;
      border-radius: 2px;
    }

    .section-text pre {
      background: #f5f5f5;
      padding: 1rem 1.25rem;
      overflow-x: auto;
      margin: 1.5rem 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 2px;
    }

    .section-text pre code {
      background: none;
      padding: 0;
    }

    .section-text table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 14px;
    }

    .section-text th,
    .section-text td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #e0e0e0;
    }

    .section-text th {
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
    }

    .section-text blockquote {
      border-left: 2px solid #e0e0e0;
      padding-left: 1.25rem;
      margin: 1.5rem 0;
      color: #666;
      font-style: italic;
    }

    .section-text a {
      color: #666;
    }

    .section-text a:hover {
      color: #1a1a1a;
    }

    /* TOC list styling */
    .toc-list {
      list-style: none;
      padding-left: 0;
    }

    .toc-list li {
      border-bottom: 1px solid #eee;
    }

    .toc-list li:last-child {
      border-bottom: none;
    }

    .toc-list a {
      display: block;
      padding: 1rem 0;
      color: #1a1a1a;
    }

    .toc-list li:first-child a {
      padding-top: 0;
    }

    .toc-list a:hover {
      background: #fafafa;
      margin: 0 -1rem;
      padding: 1rem;
    }

    .toc-list .title {
      font-size: 16px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 0.25rem;
    }

    .toc-list .description {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }

    /* Book navigation */
    .book-nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1rem;
      align-items: center;
      padding: 2rem 0;
      margin-top: 2rem;
      border-top: 1px solid #e0e0e0;
    }

    .book-nav a {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      color: #666;
    }

    .book-nav a:hover {
      color: #1a1a1a;
    }

    .book-nav .label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }

    .book-nav .title {
      font-size: 15px;
      font-weight: 500;
    }

    .book-nav .prev {
      text-align: left;
    }

    .book-nav .toc-center {
      text-align: center;
    }

    .book-nav .toc-center a {
      align-items: center;
    }

    .book-nav .next {
      text-align: right;
    }

    /* Footer */
    footer {
      padding: 2rem 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
      border-top: 1px solid #e0e0e0;
    }

    footer .meta {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: #888;
    }

    footer .meta a {
      color: #888;
    }

    footer .meta a:hover {
      color: #333;
    }

    /* Desktop */
    @media (min-width: 800px) {
      header {
        padding: 1.5rem 3rem;
      }

      main {
        padding: 4rem 3rem;
      }

      .page-header h1 {
        font-size: 48px;
      }

      .section {
        grid-template-columns: 180px 1fr;
        gap: 3rem;
        padding: 3rem 0;
        align-items: baseline;
      }

      .section > h2 {
        display: block;
        font-size: 18px;
        font-weight: 500;
        color: #1a1a1a;
        line-height: 1.75;
      }

      .section-text h2 {
        display: none;
        position: absolute;
        visibility: hidden;
      }

      .book-nav .title {
        font-size: 16px;
      }

      footer {
        padding: 2rem 3rem;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .breadcrumb {
        display: none;
      }

      .book-nav {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto;
      }

      .book-nav .prev {
        grid-column: 1;
      }

      .book-nav .next {
        grid-column: 2;
      }

      .book-nav .toc-center {
        grid-column: 1 / -1;
        grid-row: 2;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid #eee;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="<!-- ROOT -->index.html" class="logo">οὐθείς</a>
      <!-- BREADCRUMB -->
    </div>
    <nav>
      <a href="<!-- ROOT -->contents.html<!-- SECTION_ANCHOR -->">Contents</a>
      <a href="https://github.com/outheis-labs/outheis-beta">GitHub ↗</a>
      <span class="lang-switch"><!-- LANG_SWITCH --></span>
    </nav>
  </header>

  <main>
    <div class="page-header">
      <h1><!-- PAGE_TITLE --></h1>
      <!-- SUBTITLE -->
    </div>

    <!-- CONTENT -->

    <!-- BOOK_NAV -->
  </main>

  <footer>
    <div class="meta">
      open source · AGPL-3.0 · <a href="https://github.com/outheis-labs">github.com/outheis-labs</a>
    </div>
  </footer>

</body>
</html>
